baseURL: "https://claudiobosticco.com"
defaultContentLanguage: it
title: Claudio Bosticco
theme: ["PaperMod"]
enableRobotsTXT: true
enableGitInfo: true

frontmatter:
  lastmod: ["lastmod", ":git", "date", "publishDate"]

languages:
  it:
    locale: it-it
    label: Italiano
    weight: 1
    contentDir: content/it
    title: Claudio Bosticco
    params:
      seoTitle: "Claudio Bosticco | Responsabile sviluppo software .NET"
      description: "Responsabile sviluppo software in Sistemi Tre. Architetture .NET, prodotti WMS e MES e guida del team: esperienza, progetti e app di Claudio Bosticco."
      homeInfoParams:
        Title: Claudio Bosticco
        Content: Benvenuto nel mio sito! Sono uno sviluppatore di 35 anni specializzato in ambito .NET e ho creato questo sito come blocco appunti pubblico, raccogliendo ciò che trovo utile o interessante nel mio lavoro quotidiano. Spero che queste risorse possano essere d'aiuto anche a te e a chiunque cerchi ispirazione o una mano nei propri progetti di sviluppo.
    menu:
      main:
        - name: Articoli
          url: posts/
          weight: 10
        - name: Progetti
          url: progetti/
          weight: 20
        - name: Chi sono
          url: chi-sono/
          weight: 30
        - name: Contatti
          url: contatti/
          weight: 40
        - name: Cerca
          url: search/
          weight: 50
  en:
    locale: en-us
    label: English
    weight: 2
    contentDir: content/en
    title: Claudio Bosticco
    params:
      seoTitle: "Claudio Bosticco | Software Development Manager .NET"
      description: "Software Development Manager at Sistemi Tre. .NET architectures, WMS and MES products and team leadership: experience, projects and apps by Claudio Bosticco."
      homeInfoParams:
        Title: Claudio Bosticco
        Content: Welcome to my site! I'm a 35-year-old developer specialized in .NET and I created this site as a public notebook, collecting what I find useful or interesting in my daily work. I hope these resources can help you and anyone looking for inspiration or assistance with their development projects.
    menu:
      main:
        - name: Posts
          url: posts/
          weight: 10
        - name: Projects
          url: projects/
          weight: 20
        - name: About
          url: about/
          weight: 30
        - name: Contact
          url: contact/
          weight: 40
        - name: Search
          url: search/
          weight: 50

params:
  mainSections:
    - posts
  ShowShareButtons: true
  ShareButtons: ["linkedin"]
  socialIcons:
    - name: "linkedin"
      url: "https://www.linkedin.com/in/claudio-bosticco/"
    - name: "instagram"
      url: "https://www.instagram.com/claudio.bosticco/"
    - name: "github"
      url: "https://github.com/bostick23/"
  ShowCodeCopyButtons: true
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

outputs:
  home:
    - HTML
    - RSS
    - JSON

services:
  googleAnalytics:
    id: G-C1TXWECFHD
